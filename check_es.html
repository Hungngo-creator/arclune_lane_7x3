<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiểm tra JavaScript/WebView - Arclune</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 20px; background: #0b1115; color: #e8eef2; line-height: 1.5; }
    main { max-width: 760px; margin: auto; }
    section { margin: 14px 0; padding: 16px; border: 1px solid #33434f; border-radius: 12px; background: #111a20; }
    h1, h2 { margin-top: 0; }
    h1 { color: #ffd45e; font-size: 1.7rem; }
    h2 { font-size: 1.1rem; }
    ul { padding-left: 22px; }
    .pass { color: #65dc8d; font-weight: 700; }
    .fail { color: #ff7d7d; font-weight: 700; }
    .note { color: #b6c5cf; }
    code { overflow-wrap: anywhere; }
  </style>
</head>
<body>
    <main>
    <h1>Kiểm tra JavaScript/WebView</h1>
    <section id="environment">Đang đọc thông tin WebView...</section>
    <section id="summary">Đang kiểm tra...</section>
    <section>
      <h2>Cú pháp JavaScript</h2>
      <ul id="syntax-results"></ul>
    </section>
    <section>
      <h2>API theo phiên bản</h2>
      <p class="note">API và cú pháp có thể đạt hai mức khác nhau. Một API thiếu không có nghĩa trình phân tích cú pháp quá cũ.</p>
      <ul id="api-results"></ul>
    </section>
  </main>
  <script src="./tools/es-compatibility-probes.js"></script>
  <script>
    (function () {
      'use strict';
      var report = window.ArcluneESProbes.run(window);
      var pass = '<span class="pass">HỖ TRỢ ✅</span>';
      var fail = '<span class="fail">KHÔNG HỖ TRỢ ❌</span>';

    function renderList(id, results) {
        var list = document.getElementById(id);
        results.forEach(function (result) {
          var item = document.createElement('li');
          item.innerHTML = result.name + ': ' + (result.supported ? pass : fail);
          list.appendChild(item);
        });
    }

document.getElementById('environment').innerHTML =
        '<h2>Môi trường thực sự đang chạy trang</h2>' +
        '<p><strong>User-Agent:</strong> <code></code></p>' +
        '<p><strong>Chromium/WebView suy ra:</strong> ' + (report.chromiumMajor || 'không xác định') + '</p>';
      document.querySelector('#environment code').textContent = report.userAgent;
      document.getElementById('summary').innerHTML =
        '<h2>Kết luận</h2><p>Cú pháp tối thiểu liên tục: <strong>' + report.syntaxEdition +
        '</strong></p><p>Nhóm API tối thiểu liên tục: <strong>' + report.apiEdition + '</strong></p>';
      renderList('syntax-results', report.syntax);
      renderList('api-results', report.apis);
    }());
  </script>
  </body>
</html>
