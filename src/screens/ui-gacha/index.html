<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo UI Gacha</title>
    <link rel="stylesheet" href="gacha.css" />
  </head>
  <body class="gacha-page">
    <div data-gacha-content></div>
    <script type="module">
      import { mountGachaUI } from './gacha.js';

      const target = document.querySelector('[data-gacha-content]');
      if (target instanceof HTMLElement) {
        mountGachaUI(target);
      }
    </script>
  </body>
</html>
