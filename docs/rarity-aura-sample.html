<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Arclune Lane - Aura Card Sample</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;color:#eaf3ff;font-family:Inter,system-ui,sans-serif}
    .character-card{position:relative;width:220px;height:320px;border-radius:20px;overflow:hidden;background:linear-gradient(160deg,#141a2f,#090e1f)}
    .character-card .portrait{position:absolute;inset:10px;border-radius:16px;overflow:hidden;z-index:1}
    .character-card .portrait img{width:100%;height:100%;object-fit:cover;display:block}
    .character-card .meta{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;background:rgba(8,12,24,.65);backdrop-filter:blur(4px);padding:8px 10px;border-radius:12px}
    .character-card .meta h3{margin:0;font-size:14px;letter-spacing:.04em}
    .character-card .meta p{margin:2px 0 0;font-size:12px;color:#b7c6e3}
  </style>
</head>
<body>
  <!-- Single reusable structure: đổi rank-n/r/sr/ssr/ur/prime -->
  <article class="character-card" data-rank="prime">
    <div class="rarity-aura rank-prime" aria-hidden="true">
      <div class="glow"></div>
      <div class="ring"></div>
      <div class="sweep"></div>
      <div class="spark-layer"></div>
    </div>
    <div class="portrait">
      <img src="../assets/units/leaderA/default.svg" alt="Character portrait" />
    </div>
    <footer class="meta">
      <h3>Prime Vanguard</h3>
      <p>Rarity: PRIME</p>
    </footer>
  </article>

  <script>
    // Optional tiny particle helper for SSR/UR/PRIME.
    (function initAuraParticles(){
      const aliveRanks = new Set(['ssr','ur','prime']);
      const card = document.querySelector('.character-card');
      const aura = card?.querySelector('.rarity-aura');
      const layer = aura?.querySelector('.spark-layer');
      if (!card || !aura || !layer){ return; }
      const rank = String(card.dataset.rank || '').toLowerCase();
      if (!aliveRanks.has(rank)){ return; }

      const createParticle = () => {
        const p = document.createElement('span');
        p.className = 'spark';
        const angle = Math.random() * Math.PI * 2;
        const radius = 10 + Math.random() * 52;
        p.style.setProperty('--spark-x', `${Math.cos(angle) * radius}px`);
        p.style.setProperty('--spark-y', `${Math.sin(angle) * radius}px`);
        p.style.setProperty('--spark-duration', `${760 + Math.random() * 580}ms`);
        p.style.setProperty('--spark-delay', `${Math.random() * 120}ms`);
        layer.appendChild(p);
        setTimeout(() => p.remove(), 1500);
      };

      const burst = () => {
        const count = 3 + Math.floor(Math.random() * 3);
        for (let i = 0; i < count; i += 1){ createParticle(); }
      };

      burst();
      setInterval(burst, 1200);
    })();
  </script>
</body>
</html>
